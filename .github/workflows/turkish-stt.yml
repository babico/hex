name: Turkish STT fork checks and unsigned builds
on:
  push:
    branches: [feature/turkish-stt]
  workflow_dispatch:
    inputs:
      build_desktop:
        type: boolean
        default: true
        description: Build unsigned desktop packages
permissions:
  contents: read
concurrency:
  group: turkish-stt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  companion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test registry and adapter dispatch without model weights
        run: python -m unittest discover -s extras/turkish-stt -p "test_*.py"
  desktop:
    if: github.event_name == 'push' || inputs.build_desktop
    needs: [companion, sherpa-native]
    uses: ./.github/workflows/build-desktop.yml
    with:
      sha: ${{ github.sha }}
      version: 0.0.0-dev-${{ github.run_number }}
      channel: ""
      test-build: true
      artifact-prefix: turkish-stt
      turkish-stt: true
  macos:
    if: github.event_name == 'push' || inputs.build_desktop
    needs: [companion, sherpa-native]
    runs-on: macos-26
    timeout-minutes: 120
    env:
      HEX_VERSION: 0.0.0-dev-${{ github.run_number }}
      HEX_BUILD_CHANNEL: ""
      HEX_TEST_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install Metal toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: turkish-stt-sherpa-macos-arm64
          path: ${{ runner.temp }}/native-stt
      - name: Build unsigned app and DMG
        run: |
          scripts/setup.sh
          scripts/set-crate-version.sh "$PWD" "$HEX_VERSION"
          bundle=$(HEX_TURKISH_STT_DIR="$RUNNER_TEMP/native-stt" HEX_RELEASE_UNSIGNED=1 scripts/build-app.sh)
          mkdir -p "$RUNNER_TEMP/macos"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$bundle" "$RUNNER_TEMP/macos/Hex.app.zip"
          hdiutil create -volname "Hex Turkish STT" -srcfolder "$bundle" -ov -format UDZO "$RUNNER_TEMP/macos/Hex.dmg"
      - uses: ./.github/release/upload
        with:
          name: turkish-stt-macos-arm64
          path: ${{ runner.temp }}/macos
  sherpa-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: windows-x64
          - os: windows-11-arm
            target: windows-arm64
          - os: macos-26
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and load native CPU worker
        run: python extras/turkish-stt/native/build.py --target ${{ matrix.target }} --output native-dist
      - uses: ./.github/release/upload
        with:
          name: turkish-stt-sherpa-${{ matrix.target }}
          path: native-dist

  native-inference:
    needs: sherpa-native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [seda-v2, seda-tiny, ufakzeka-kulak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: turkish-stt-sherpa-linux-x64
          path: native-dist
      - name: Benchmark two real Turkish decodes in the same process
        run: |
          chmod +x native-dist/hex-sherpa-worker
          python extras/turkish-stt/native/benchmark.py --worker native-dist/hex-sherpa-worker --model ${{ matrix.model }} --output metrics/result.json
      - uses: ./.github/release/upload
        if: success()
        with:
          name: turkish-stt-metrics-${{ matrix.model }}
          path: metrics
  portable:
    needs: [desktop, sherpa-native]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            desktop: linux-x86_64
          - target: linux-arm64
            desktop: linux-aarch64
          - target: windows-x64
            desktop: windows-x86_64
          - target: windows-arm64
            desktop: windows-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: turkish-stt-${{ matrix.desktop }}
          path: desktop-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: turkish-stt-sherpa-${{ matrix.target }}
          path: native-dist
      - name: Combine executable and native runtime
        run: python extras/turkish-stt/native/bundle.py --target ${{ matrix.target }} --desktop desktop-dist --native native-dist --output bundles
      - uses: ./.github/release/upload
        with:
          name: turkish-stt-portable-${{ matrix.target }}
          path: bundles
